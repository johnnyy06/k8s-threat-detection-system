# =============================================================================
# audit-forwarder.yaml - face puntea intre FISIERUL de audit log al apiserver-ului
# si webhook listener-ul plugin-ului Falco k8saudit.
#
# De ce exista: pe acest cluster MicroK8s/kubelite niciuna dintre caile "native"
# de live-feed nu a functionat - driver-ul file:// al k8saudit 0.18 nu face tail pe
# un fisier hostPath in care se scrie continuu, iar backend-ul *webhook* de audit al
# kube-apiserver nu se initializeaza pe apiserver-ul embedded in kubelite (flag
# prezent + config valid, dar zero metrici webhook si zero livrare). Ambele sunt
# dead-end-uri dovedite (2026-06-27).
#
# Ce FUNCTIONEAZA (dovedit): (1) apiserver-ul scrie fiabil evenimentele de audit in
# /var/log/kubernetes/audit/audit.log conform audit-policy.yaml; (2) Falco citeste
# corect fisierul in mod batch (regulile trag: Create Privileged Pod, ...);
# (3) webserver-ul embedded al plugin-ului k8saudit accepta EventList-uri prin POST.
#
# Forwarder-ul coase (1)+(3): face tail pe audit log si trimite (POST) fiecare
# eveniment (impachetat intr-un EventList) catre Service-ul webhook al plugin-ului.
# Rezultat: detectie live API/admission, complet decuplata de sanatatea apiserver-ului
# (apiserver-ul doar scrie un fisier), care supravietuieste restart-urilor Falco/forwarder.
#
# Ruleaza ca root (audit.log e 0600 root) si pe node-1 (unde e fisierul).
# Nota rotatie: foloseste `tail -f` (BusyBox nu are -F); cu audit policy-ul minimal
# pragul de rotatie de 50MB nu e atins niciodata intr-un demo. Daca log-ul totusi se
# roteste, restarteaza acest Deployment.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-forwarder
  namespace: falco
  labels:
    app: audit-forwarder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audit-forwarder
  template:
    metadata:
      labels:
        app: audit-forwarder
    spec:
      # Audit log-ul e un fisier hostPath pe nodul de control-plane.
      nodeSelector:
        kubernetes.io/hostname: node-1
      containers:
        - name: forwarder
          image: curlimages/curl:8.11.1
          securityContext:
            runAsUser: 0          # citeste audit.log-ul detinut de root (0600)
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "audit-forwarder: tailing audit.log -> k8saudit webhook"
              tail -n 0 -f /var/log/kubernetes/audit/audit.log | while IFS= read -r line; do
                [ -z "$line" ] && continue
                printf '{"kind":"EventList","apiVersion":"audit.k8s.io/v1","items":[%s]}' "$line" | \
                  curl -sS -o /dev/null --max-time 5 -X POST \
                    -H 'Content-Type: application/json' --data-binary @- \
                    http://falco-k8saudit-webhook.falco.svc.cluster.local:9765/k8s-audit || true
              done
          volumeMounts:
            - name: audit-log
              mountPath: /var/log/kubernetes/audit
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: audit-log
          hostPath:
            path: /var/log/kubernetes/audit
            type: Directory
