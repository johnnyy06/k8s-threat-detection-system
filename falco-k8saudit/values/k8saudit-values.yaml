# =============================================================================
# k8saudit-values.yaml - al doilea release Falco = stratul de detectie K8s API/audit.
#
# Aceasta e o instanta Falco DOAR-PLUGIN (fara kernel driver, fara captura de
# syscall-uri). Primeste evenimentele de audit ale kube-apiserver printr-un WEBHOOK
# (apiserver-ul trimite POST batch-uri de audit catre webserver-ul embedded al
# plugin-ului k8saudit) si alimenteaza ACELASI pipeline ELK ca Falco syscall:
# falcosidekick -> Logstash:5045 -> security-*.
#
# De ce webhook si nu file:// : modul file:// follow al k8saudit 0.18 nu face tail
# pe un fisier hostPath in care se scrie continuu in acest mediu (citeste pana la
# EOF la deschidere si rateaza append-urile; citirea batch/no-scheme functioneaza,
# dar e one-shot). Webhook e calea canonica, fiabila de ingestie Falco k8saudit.
# Webhook-ul de audit al apiserver-ului e asincron/batched - un backend lent sau
# picat nu blocheaza niciodata cererile API (evenimentele fac buffer apoi se pierd).
# Pastram DE ASEMENEA --audit-log-path pe apiserver ca un trail independent pe disk
# de debug/backup (cost neglijabil cu audit-policy.yaml-ul minimal).
#
# Scop (teza): adauga stratul de detectie API/admission pe care Falco syscall nu-l
# poate vedea structural - inchide gap-ul s01/s08 unde "deploy pod privileged"
# nu producea NICIO detectie. Defense-in-depth: host/syscall=Falco,
# network=Suricata, API=k8saudit.
#
# Deploy impreuna cu local-values.yaml partajat (endpoint Logstash, gitignored):
#   helm upgrade --install falco-k8saudit falcosecurity/falco -n falco \
#     --version 8.0.2 -f values/k8saudit-values.yaml -f ../falco/config/local-values.yaml
#
# Partea de apiserver (node-1): --audit-webhook-config-file -> http://127.0.0.1:30007/k8s-audit
# (NodePort-ul de mai jos). Vezi falco-k8saudit/README.md pentru kubeconfig-ul webhook.
# =============================================================================

# Fara kernel driver / fara collectors de syscall - instanta doar-plugin.
driver:
  enabled: false
collectors:
  enabled: false

# Un singur Deployment (un consumator al stream-ului de audit apiserver), nu DaemonSet.
controller:
  kind: deployment
  deployment:
    replicas: 1

# Expune webserver-ul plugin-ului (portul container 9765) ca NodePort, ca
# apiserver-ul de pe node-1 sa poata trimite POST evenimente la http://127.0.0.1:30007/k8s-audit.
# kube-proxy ruteaza NodePort-ul catre pod oriunde ar fi scheduled.
services:
  - name: webhook
    type: NodePort
    ports:
      - port: 9765
        nodePort: 30007
        protocol: TCP

# Instaleaza plugin-ul k8saudit + regulile lui via falcoctl (plugin-ul json vine in imagine).
falcoctl:
  artifact:
    install:
      enabled: true
    follow:
      enabled: true
  config:
    artifact:
      install:
        refs: [k8saudit-rules:0, k8saudit:0]
      follow:
        refs: [k8saudit-rules:0]

falco:
  # Ruleset doar-plugin: regulile stock k8s audit + un dir rules.d pentru viitoarele
  # noastre reguli custom K8S_THREAT de audit. NB: asta INLOCUIESTE rules_files-ul
  # syscall default (intentionat - nu exista evenimente syscall aici).
  rules_files:
    - /etc/falco/k8s_audit_rules.yaml
    - /etc/falco/rules.d
  plugins:
    - name: k8saudit
      library_path: libk8saudit.so
      init_config: ""
      # Mod WEBHOOK: serverul HTTP embedded al plugin-ului asculta pe :9765/k8s-audit.
      open_params: "http://:9765/k8s-audit"
    - name: json
      library_path: libjson.so
      init_config: ""
  load_plugins: [k8saudit, json]
  json_output: true
  json_include_output_property: true
  # Declanseaza TOATE regulile care matcheaza per eveniment de audit (default e 'first',
  # care ar lasa doar "Create Privileged Pod" sa traga pe un escape-pod si ar suprima
  # regulile suprapuse "Create Sensitive Mount Pod" / "Create HostNetwork Pod" /
  # "Create HostPid Pod" - acelasi motiv de defense-in-depth ca la Falco syscall.
  rule_matching: all

# Ruteaza evenimentele catre ACELASI Logstash ca Falco syscall.
# Adresa webhook propriu-zisa vine din overlay-ul local-values.yaml partajat.
falcosidekick:
  enabled: true