# =============================================================================
# audit-policy.yaml - audit policy pentru API server-ul Kubernetes, pentru
# plugin-ul Falco k8saudit (teza: stratul de detectie API/admission).
#
# Obiectiv de design: volum MINIM de scriere pe disk pe node-1 (bottleneck
# dqlite/disk I/O cunoscut), capturand totusi semnalul de care au nevoie regulile
# de amenintare k8saudit - cel mai important SPEC-ul workload-ului (RequestResponse)
# ca pod-urile privileged / hostPath / hostPID sa fie detectabile la admission
# (inchide gap-ul s01 container-escape + s08 malicious-deployment, unde pasul
# "deploy pod privileged" NU era detectat: Falco la nivel syscall nu vede niciodata
# un kubectl apply, doar API server-ul il vede).
#
# Control de volum: get/list/watch + leases + events + endpoints -> None
# (acestea sunt peste 90% din volumul de audit si nu au valoare de detectie aici).
#
# Deploy: copiaza la /var/snap/microk8s/current/args/audit-policy.yaml pe node-1
# si referentiaz-o din kube-apiserver prin --audit-policy-file. Vezi README.md.
# =============================================================================
apiVersion: audit.k8s.io/v1
kind: Policy
# Nu emite un eveniment la primirea cererii; un eveniment per cerere finalizata e suficient.
omitStages:
  - "RequestReceived"
rules:
  # --- Arunca intai zgomotul de frecventa mare (ordinea conteaza: primul match castiga) ---

  # Citirile/watch-urile sunt grosul volumului de audit si irelevante pentru detectie.
  - level: None
    verbs: ["get", "list", "watch"]

  # Reinnoiri de lease (heartbeat-uri de nod, leader election) - extrem de zgomotoase.
  - level: None
    resources:
      - group: "coordination.k8s.io"
        resources: ["leases"]

  # Events / endpoints / endpointslices - churn mare, valoare mica.
  - level: None
    resources:
      - group: ""
        resources: ["events", "endpoints"]
      - group: "discovery.k8s.io"
        resources: ["endpointslices"]

  # --- Semnalul: write-uri de workload + RBAC CU request body ---
  # RequestResponse e necesar ca SPEC-ul pod-ului/workload-ului sa fie capturat si
  # regulile k8saudit sa poata vedea privileged=true, hostPath, hostPID, hostNetwork etc.
  - level: RequestResponse
    verbs: ["create", "update", "patch", "delete"]
    resources:
      - group: ""
        resources: ["pods", "pods/exec", "pods/attach", "pods/portforward"]
      - group: "apps"
        resources: ["deployments", "daemonsets", "statefulsets", "replicasets"]
      - group: "batch"
        resources: ["jobs", "cronjobs"]
      - group: "rbac.authorization.k8s.io"
        resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]

  # --- Secrets / configmaps / serviceaccounts: doar metadata (cine/ce, fara payload) ---
  - level: Metadata
    resources:
      - group: ""
        resources: ["secrets", "configmaps", "serviceaccounts"]

  # --- Tot restul: arunca (default minimal-disk) ---
  - level: None
