# =============================================================================
# Logstash Pipeline — Sistem detecție amenințări Kubernetes
# =============================================================================
# Input:
#   - Port 5044 (Beats): Filebeat de pe node-2 (Suricata) și node-3 (k8s-apps)
#   - Port 5045 (HTTP): Falco Sidekick (alerte Falco)
#
# Filter:
#   - Stage 1 (tagging): Evenimentele primesc tag "suricata" sau "falco"
#   - Stage 2 (ECS enrichment): câmpurile sursă sunt copiate în câmpuri ECS
#       canonice (Elastic Common Schema), aditiv — câmpurile vechi rămân
#       intacte pentru compatibilitate cu interogările existente.
#     Referință: https://www.elastic.co/docs/reference/ecs
#
# Output:
#   - Toate datele indexate în security-YYYY.MM.DD
# =============================================================================

input {
  # Primește date de la Filebeat (node-2 Suricata, node-3 k8s-apps)
  beats {
    port => 5044
  }
  # Primește alerte Falco de la Falco Sidekick
  http {
    port => 5045
    codec => json
  }
}

filter {
  # ---------------------------------------------------------------------------
  # STAGE 1 — Tagging (necesar pentru routing-ul ECS de mai jos)
  # ---------------------------------------------------------------------------
  if [log_type] == "suricata" {
    mutate { add_tag => ["suricata"] }
  }
  # Falco Sidekick nu trimite log_type, dar trimite întotdeauna rule/priority/uuid
  if [rule] or [priority] or [uuid] {
    mutate { add_tag => ["falco"] }
  }

  # ===========================================================================
  # STAGE 2 — ECS enrichment pentru SURICATA
  # ===========================================================================
  if "suricata" in [tags] {
    # Observer (entitatea care a observat evenimentul) — ECS observer.*
    mutate {
      add_field => {
        "[observer][type]"     => "ids"
        "[observer][vendor]"   => "OISF"
        "[observer][product]"  => "Suricata"
        "[event][module]"      => "suricata"
        "[event][dataset]"     => "suricata.eve"
      }
    }
    if [host][name] {
      mutate { copy => { "[host][name]" => "[observer][hostname]" } }
    }

    # Source / Destination — ECS network triple
    if [src_ip]    { mutate { copy => { "src_ip"    => "[source][ip]" } } }
    if [src_port]  { mutate { copy => { "src_port"  => "[source][port]" } } }
    if [dest_ip]   { mutate { copy => { "dest_ip"   => "[destination][ip]" } } }
    if [dest_port] { mutate { copy => { "dest_port" => "[destination][port]" } } }

    # Network — Layer 4 (TCP/UDP) și Layer 7 (HTTP/DNS/TLS)
    if [proto]     { mutate { copy => { "proto"     => "[network][transport]" } } }
    if [app_proto] { mutate { copy => { "app_proto" => "[network][protocol]" } } }
    if [flow][bytes_toserver] {
      mutate { copy => { "[flow][bytes_toserver]" => "[source][bytes]" } }
    }
    if [flow][bytes_toclient] {
      mutate { copy => { "[flow][bytes_toclient]" => "[destination][bytes]" } }
    }
    if [flow][pkts_toserver] {
      mutate { copy => { "[flow][pkts_toserver]" => "[source][packets]" } }
    }
    if [flow][pkts_toclient] {
      mutate { copy => { "[flow][pkts_toclient]" => "[destination][packets]" } }
    }

    # Event categorization — pe baza event_type
    # event.kind este restrâns la lista ECS: alert|event|metric|state|...
    if [event_type] == "alert" {
      mutate {
        add_field => {
          "[event][kind]"     => "alert"
          "[event][category]" => "network"
          "[event][type]"     => "info"
        }
      }
      mutate {
        add_field => { "[event][category]" => "intrusion_detection" }
      }
      # Rule / signature
      if [alert][signature] {
        mutate { copy => { "[alert][signature]"    => "[rule][name]" } }
      }
      if [alert][category]  {
        mutate { copy => { "[alert][category]"     => "[rule][category]" } }
      }
      if [alert][signature_id] {
        mutate { copy => { "[alert][signature_id]" => "[rule][id]" } }
      }
      if [alert][rev] {
        mutate { copy => { "[alert][rev]"          => "[rule][version]" } }
      }
      if [alert][severity] {
        mutate { copy => { "[alert][severity]"     => "[event][severity]" } }
      }
    } else if [event_type] == "stats" {
      mutate { add_field => { "[event][kind]" => "metric" } }
    } else {
      # flow, dns, http, tls, fileinfo, etc. — observații, nu alerte
      mutate {
        add_field => {
          "[event][kind]"     => "event"
          "[event][category]" => "network"
        }
      }
    }
  }

  # ===========================================================================
  # STAGE 2 — ECS enrichment pentru FALCO
  # ===========================================================================
  if "falco" in [tags] {
    # Observer
    mutate {
      add_field => {
        "[observer][type]"     => "hids"
        "[observer][vendor]"   => "falcosecurity"
        "[observer][product]"  => "Falco"
        "[event][module]"      => "falco"
        "[event][dataset]"     => "falco.alert"
        "[event][kind]"        => "alert"
        "[event][category]"    => "intrusion_detection"
      }
    }
    if [hostname] {
      mutate { copy => { "hostname" => "[observer][hostname]" } }
    }

    # Rule — ECS rule.*
    # Falco trimite `rule` ca string la top-level → conflict cu rule.name (object).
    # Folosim `rename` ca să mutăm stringul în locul ECS canonic (rule.name).
    if [rule] {
      mutate { rename => { "rule" => "[rule][name]" } }
    }
    # Falco trimite `source` ca string ("syscall"|"k8s_audit"|...) → conflict cu
    # source.ip (object) folosit de Suricata. ECS canonical pentru asta = event.provider.
    if [source] {
      mutate { rename => { "source" => "[event][provider]" } }
    }

    # Falco priority text → event.severity numeric (syslog convention)
    if [priority] {
      translate {
        source       => "priority"
        target       => "[event][severity]"
        dictionary   => {
          "Emergency"     => 0
          "Alert"         => 1
          "Critical"      => 2
          "Error"         => 3
          "Warning"       => 4
          "Notice"        => 5
          "Informational" => 6
          "Info"          => 6
          "Debug"         => 7
        }
        fallback     => 6
      }
      # Păstrăm și log.level pentru filtrare friendly
      mutate { copy => { "priority" => "[log][level]" } }
    }

    # output_fields.* — chei cu puncte literale (NU nested), accesate cu [brackets]
    if [output_fields][proc.name] {
      mutate { copy => { "[output_fields][proc.name]" => "[process][name]" } }
    }
    if [output_fields][proc.cmdline] {
      mutate { copy => { "[output_fields][proc.cmdline]" => "[process][command_line]" } }
    }
    if [output_fields][proc.pid] {
      mutate { copy => { "[output_fields][proc.pid]" => "[process][pid]" } }
    }
    if [output_fields][user.name] {
      mutate { copy => { "[output_fields][user.name]" => "[user][name]" } }
    }
    if [output_fields][user.uid] {
      mutate { copy => { "[output_fields][user.uid]" => "[user][id]" } }
    }
    if [output_fields][fd.name] {
      mutate { copy => { "[output_fields][fd.name]" => "[file][path]" } }
    }
    if [output_fields][container.id] {
      mutate { copy => { "[output_fields][container.id]" => "[container][id]" } }
    }
    if [output_fields][container.name] {
      mutate { copy => { "[output_fields][container.name]" => "[container][name]" } }
    }
    if [output_fields][container.image.repository] {
      mutate { copy => { "[output_fields][container.image.repository]" => "[container][image][name]" } }
    }
    if [output_fields][container.image.tag] {
      mutate { copy => { "[output_fields][container.image.tag]" => "[container][image][tag]" } }
    }
    # Kubernetes — populăm AMBELE seturi: ECS-pur (orchestrator.*) +
    # convenția practică din ecosistemul Elastic (kubernetes.*)
    if [output_fields][k8s.pod.name] {
      mutate {
        copy => {
          "[output_fields][k8s.pod.name]" => "[orchestrator][resource][name]"
        }
        add_field => {
          "[orchestrator][resource][type]" => "pod"
          "[orchestrator][type]"           => "kubernetes"
          "[orchestrator][cluster][name]"  => "microk8s-licenta"
        }
      }
      mutate { copy => { "[output_fields][k8s.pod.name]" => "[kubernetes][pod][name]" } }
    }
    if [output_fields][k8s.ns.name] {
      mutate { copy => { "[output_fields][k8s.ns.name]" => "[orchestrator][namespace]" } }
      mutate { copy => { "[output_fields][k8s.ns.name]" => "[kubernetes][namespace]" } }
    }
  }

  # ===========================================================================
  # STAGE 3 — MITRE ATT&CK din tags Falco → threat.*
  # ===========================================================================
  # Regulile noastre Falco au tags[] cu:
  #   - tehnici:  "T1552", "T1565", "T1059", "T1496", "T1611", "T1610",
  #               "T1548", "T1046", "T1071", "T1048" (+ subtechnici T1xxx.yyy)
  #   - tactici:  "mitre_credential_access", "mitre_discovery", ...
  # Extragem și mapăm la câmpurile ECS canonice (threat.framework,
  # threat.technique.id/name, threat.tactic.id/name).
  if "falco" in [tags] and [tags] {
    ruby {
      code => '
        technique_map = {
          # Tehnici folosite explicit de regulile noastre K8S_THREAT
          "T1046"     => "Network Service Discovery",
          "T1048"     => "Exfiltration Over Alternative Protocol",
          "T1059"     => "Command and Scripting Interpreter",
          "T1071"     => "Application Layer Protocol",
          "T1496"     => "Resource Hijacking",
          "T1548"     => "Abuse Elevation Control Mechanism",
          "T1552"     => "Unsecured Credentials",
          "T1565"     => "Data Manipulation",
          "T1610"     => "Deploy Container",
          "T1611"     => "Escape to Host",
          # Tehnici taggate de regulile default Falco (maturity_stable) care apar la noi
          "T1003"     => "OS Credential Dumping",
          "T1055"     => "Process Injection",
          "T1057"     => "Process Discovery",
          "T1068"     => "Exploitation for Privilege Escalation",
          "T1078"     => "Valid Accounts",
          "T1083"     => "File and Directory Discovery",
          "T1098"     => "Account Manipulation",
          "T1136"     => "Create Account",
          "T1190"     => "Exploit Public-Facing Application",
          "T1203"     => "Exploitation for Client Execution",
          "T1485"     => "Data Destruction",
          "T1505"     => "Server Software Component",
          "T1543"     => "Create or Modify System Process",
          "T1547"     => "Boot or Logon Autostart Execution",
          "T1553"     => "Subvert Trust Controls",
          "T1554"     => "Compromise Client Software Binary",
          "T1555"     => "Credentials from Password Stores",
          "T1557"     => "Adversary-in-the-Middle",
          "T1557.002" => "ARP Cache Poisoning",
          "T1562"     => "Impair Defenses",
          "T1564"     => "Hide Artifacts",
          "T1570"     => "Lateral Tool Transfer",
          "T1574"     => "Hijack Execution Flow",
          "T1574.006" => "Dynamic Linker Hijacking"
        }
        tactic_map = {
          "mitre_initial_access"        => ["TA0001", "Initial Access"],
          "mitre_execution"             => ["TA0002", "Execution"],
          "mitre_persistence"           => ["TA0003", "Persistence"],
          "mitre_privilege_escalation"  => ["TA0004", "Privilege Escalation"],
          "mitre_defense_evasion"       => ["TA0005", "Defense Evasion"],
          "mitre_credential_access"     => ["TA0006", "Credential Access"],
          "mitre_discovery"             => ["TA0007", "Discovery"],
          "mitre_lateral_movement"      => ["TA0008", "Lateral Movement"],
          "mitre_collection"            => ["TA0009", "Collection"],
          "mitre_exfiltration"          => ["TA0010", "Exfiltration"],
          "mitre_command_and_control"   => ["TA0011", "Command and Control"],
          "mitre_impact"                => ["TA0040", "Impact"]
        }
        tags = event.get("tags")
        next unless tags.is_a?(Array)

        tech_ids = tags.select { |t| t.is_a?(String) && t =~ /^T\d+(\.\d+)?$/ }
        tactic_ids   = []
        tactic_names = []
        tags.each do |t|
          if t.is_a?(String) && tactic_map.key?(t)
            tactic_ids   << tactic_map[t][0]
            tactic_names << tactic_map[t][1]
          end
        end

        if !tech_ids.empty? || !tactic_ids.empty?
          event.set("[threat][framework]", "MITRE ATT&CK")
        end
        if !tech_ids.empty?
          event.set("[threat][technique][id]", tech_ids.uniq)
          event.set("[threat][technique][name]",
                    tech_ids.uniq.map { |id| technique_map[id] || id })
        end
        if !tactic_ids.empty?
          event.set("[threat][tactic][id]",   tactic_ids.uniq)
          event.set("[threat][tactic][name]", tactic_names.uniq)
        end
      '
    }
  }
}

output {
  elasticsearch {
    hosts => ["localhost:9200"]
    index => "security-%{+YYYY.MM.dd}"
  }
}
