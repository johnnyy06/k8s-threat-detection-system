apiVersion: v1
kind: ConfigMap
metadata:
  name: falco-talon-config
  namespace: falco-system
data:
  config.yaml: |
    listenAddress: 0.0.0.0
    listenPort: 2803
    
    defaultNotifiers:
      - slack
      - elasticsearch
    
    rules:
      - name: "Terminal shell in container"
        match:
          rules:
            - "Terminal shell in container"
        actions:
          - action: kubernetes:terminate
            parameters:
              gracePeriodSeconds: 0
          - action: kubernetes:label
            parameters:
              labels:
                suspicious: "true"
                
      - name: "Cryptomining detected"
        match:
          rules:
            - "Detect crypto miners"
        actions:
          - action: kubernetes:networkpolicy
            parameters:
              allow: []
          - action: kubernetes:terminate
            
      - name: "Privilege escalation"
        match:
          rules:
            - "Detect su or sudo"
        actions:
          - action: kubernetes:label
            parameters:
              labels:
                escalation-attempt: "true"
