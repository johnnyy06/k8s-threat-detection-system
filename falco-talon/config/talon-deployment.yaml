apiVersion: apps/v1
kind: Deployment
metadata:
  name: falco-talon
  namespace: falco-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: falco-talon
  template:
    metadata:
      labels:
        app: falco-talon
    spec:
      serviceAccountName: falco-talon
      containers:
      - name: falco-talon
        image: falcosecurity/falco-talon:latest
        ports:
        - containerPort: 2803
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
        volumeMounts:
        - name: config
          mountPath: /etc/falco-talon
      volumes:
      - name: config
        configMap:
          name: falco-talon-config
---
apiVersion: v1
kind: Service
metadata:
  name: falco-talon
  namespace: falco-system
spec:
  selector:
    app: falco-talon
  ports:
  - port: 2803
    targetPort: 2803
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: falco-talon
  namespace: falco-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: falco-talon
rules:
- apiGroups: [""]
  resources: ["pods", "namespaces"]
  verbs: ["get", "list", "delete", "patch", "update"]
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["create", "delete", "get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: falco-talon
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: falco-talon
subjects:
- kind: ServiceAccount
  name: falco-talon
  namespace: falco-system
