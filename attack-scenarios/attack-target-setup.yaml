apiVersion: v1
kind: Namespace
metadata:
  name: attack-target
  labels:
    purpose: thesis-attack-scenarios
---
apiVersion: v1
kind: Pod
metadata:
  name: attack-pod
  namespace: attack-target
  labels:
    role: attack-source
spec:
  nodeName: node-2
  containers:
    - name: attacker
      image: ubuntu:22.04
      command: ["sleep", "infinity"]
      securityContext:
        runAsUser: 0
        capabilities:
          add: ["SYS_ADMIN"]
  restartPolicy: Always
