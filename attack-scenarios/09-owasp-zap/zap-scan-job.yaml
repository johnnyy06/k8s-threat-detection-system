apiVersion: batch/v1
kind: Job
metadata:
  name: zap-scan
  namespace: attack-target
  labels:
    role: attack-source
    scenario: "09-owasp-zap"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1200          # plasa de siguranta: max 20 min
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        role: attack-source
        scenario: "09-owasp-zap"
    spec:
      # node-2 (worker, are sensor Suricata) — schimbat de pe node-4 (ELK, fara sensor)
      # 2026-06-17: model de amenintare mai plauzibil (atacatorul ajunge pe nodurile cu workload-uri,
      # nu pe nodul ELK) + vizibilitate NIDS mai buna. NU node-3 (unde e DVWA): ZAP pe node-3 ->
      # DVWA node-3 ar fi INTRA-NOD = Suricata-blind. Pe node-2: ZAP->DVWA(node-3) e inter-nod ->
      # prins de senzorul node-3 (sensor-near-target) + outbound-ul ZAP prins de senzorul node-2.
      nodeSelector:
        kubernetes.io/hostname: node-2
      restartPolicy: Never
      containers:
        - name: zap
          image: ghcr.io/zaproxy/zaproxy:stable
          # zap-full-scan = spider + AJAX spider + ACTIVE scan (arunca payload-uri
          # reale SQLi/XSS/path-traversal). -I = exit 0 chiar daca gaseste warnings.
          # -m 2 = 2 min spider. Tinta = pod-ul DVWA direct (cross-node).
          command: ["zap-full-scan.py"]
          args: ["-t", "http://10.1.139.66", "-I", "-m", "2"]
