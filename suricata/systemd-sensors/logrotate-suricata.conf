# Logrotate pentru log-urile Suricata — se instaleaza ca /etc/logrotate.d/suricata pe AMBELE
# noduri-senzor (node-2 + node-3). logrotate ruleaza zilnic via logrotate.timer (00:00 UTC).
#
# DE CE acest fisier (descoperit 2026-06-13):
#  - node-2 NU avea deloc /etc/logrotate.d/suricata => eve.json crescuse la 25,6 GB
#    (+ stats.log 14,6 GB) => ~40 GB neacoperiti pe un cluster cu disk I/O bottleneck.
#  - node-3 avea un config dar fara directiva `su` => logrotate il SARI cu eroarea
#    "skipping ... parent directory has insecure permissions ... Set su directive"
#    (logrotate modern refuza sa roteasca un dir detinut de suricata:suricata, nu root).
#
# Cheia fix-ului = `su suricata suricata` (dir-ul /var/log/suricata e suricata:suricata 0770).
# `copytruncate` = Suricata isi pastreaza fd-ul si scrie in continuare (nu necesita HUP/reopen);
# e si compatibil cu harvester-ul Filebeat care urmareste eve.json dupa inode.
#
# Instalare:
#   sudo cp logrotate-suricata.conf /etc/logrotate.d/suricata
#   sudo logrotate -dv /etc/logrotate.d/suricata   # test: fara erori de permisiuni
# Pentru a recupera spatiul de la un eve.json deja urias (datele sunt deja in ES via Filebeat):
#   sudo truncate -s 0 /var/log/suricata/eve.json /var/log/suricata/stats.log /var/log/suricata/fast.log

/var/log/suricata/*.log
/var/log/suricata/*.json
{
    su suricata suricata
    daily
    rotate 7
    maxsize 2G
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    sharedscripts
}
