---
# =============================================================================
# PLAYBOOK: node-3 — Application Node (senzor Suricata + workloads)
# =============================================================================
# Starea ACTUALA: node-3 are ACUM un senzor Suricata (adaugat 2026-05-31,
# sensor-near-target — nodul are aplicatiile-tinta DVWA/Juice Shop, deci prinde
# atacurile asupra lor indiferent de nodul atacatorului). Config identic cu node-2
# via tasks/suricata_sensor.yml (Filebeat va avea camp node=node-3).
#
# Aplicatiile vulnerabile (DVWA, Juice Shop) NU se instaleaza aici — sunt deployate
# din node-1 (kubectl apply) cu nodeSelector node-role=application si sunt scheduled
# pe acest nod. Vezi node1_control_plane.yml.
#
# Rulare:
#   ansible-playbook -i inventories/hosts.ini playbooks/node3_application.yml
# =============================================================================

- name: Configurare Node-3 — Application Node (Suricata + workloads)
  hosts: application_node
  become: true
  gather_facts: true

  tasks:
    - name: Setup senzor Suricata + Filebeat
      import_tasks: ../tasks/suricata_sensor.yml

    # --- Health checks ---
    - name: "[CHECK] Suricata / Filebeat status"
      command: "systemctl is-active {{ item }}"
      loop: [suricata, filebeat]
      register: svc_status
      changed_when: false
      failed_when: false

    - name: "[CHECK] Raport stare node-3"
      debug:
        msg:
          - "Suricata: {{ svc_status.results[0].stdout | upper }}"
          - "Filebeat: {{ svc_status.results[1].stdout | upper }}"