---
# =============================================================================
# PLAYBOOK: node-2 — Security Node (senzor Suricata)
# =============================================================================
# Suricata IDS (systemd) + Filebeat -> Logstash. Config identic cu node-3
# (sensor-near-target): logica e in tasks/suricata_sensor.yml, partajata.
#   - Suricata 8.0.x (PPA OISF), ET Open + reguli locale (sid 1000010-12)
#   - HOME_NET include pod CIDR + svc CIDR, EXTERNAL_NET=any, af-packet ens3
#   - Filebeat eve.json -> Logstash:5044 (camp node=node-2)
#
# Rulare:
#   ansible-playbook -i inventories/hosts.ini playbooks/node2_security.yml
# =============================================================================

- name: Configurare Node-2 — Security Node (Suricata)
  hosts: security_node
  become: true
  gather_facts: true

  tasks:
    - name: Setup senzor Suricata + Filebeat
      import_tasks: ../tasks/suricata_sensor.yml

    # --- Health checks ---
    - name: "[CHECK] Suricata / Filebeat status"
      command: "systemctl is-active {{ item }}"
      loop: [suricata, filebeat]
      register: svc_status
      changed_when: false
      failed_when: false

    - name: "[CHECK] Raport stare node-2"
      debug:
        msg:
          - "Suricata: {{ svc_status.results[0].stdout | upper }}"
          - "Filebeat: {{ svc_status.results[1].stdout | upper }}"