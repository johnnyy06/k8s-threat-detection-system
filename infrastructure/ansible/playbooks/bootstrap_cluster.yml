---
# =============================================================================
# PLAYBOOK: bootstrap_cluster — instalare MicroK8s + formare cluster
# =============================================================================
# Instaleaza MicroK8s pe toate nodurile si formeaza cluster-ul (node-1 =
# control-plane, node-2/3/4 = workers).
#
# Cluster non-HA: un singur control-plane (node-1), restul join cu `--worker`.
#
# Rulare (INAINTE de site.yml / node1):
#   ansible-playbook -i inventories/hosts.ini playbooks/bootstrap_cluster.yml
# =============================================================================

# -----------------------------------------------------------------------------
# PLAY 1 — instaleaza MicroK8s pe TOATE nodurile
# -----------------------------------------------------------------------------
- name: Instalare MicroK8s pe toate nodurile
  hosts: all_nodes
  become: true
  gather_facts: true

  tasks:
    - name: Instalare snapd
      apt:
        name: snapd
        state: present
        update_cache: yes

    - name: Instalare MicroK8s (snap classic)
      snap:
        name: microk8s
        classic: yes
        channel: "{{ microk8s_channel }}"

    - name: Adaugare user in grupul microk8s
      user:
        name: "{{ ansible_user | default('ubuntu') }}"
        groups: microk8s
        append: yes

    - name: Asteptare MicroK8s ready
      command: microk8s status --wait-ready --timeout 300
      changed_when: false

# -----------------------------------------------------------------------------
# PLAY 2 — join workers la control-plane (node-1)
# -----------------------------------------------------------------------------
- name: Join workers la cluster
  hosts: security_node:application_node:monitoring_node
  become: true
  gather_facts: false
  serial: 1                       # cate un worker o data (token-urile add-node sunt single-use)

  vars:
    control_plane_host: "{{ groups['control_plane'][0] }}"
    control_plane_ip: "{{ hostvars[groups['control_plane'][0]].internal_ip }}"

  tasks:
    - name: Verifica daca nodul e deja in cluster
      command: microk8s kubectl get node {{ inventory_hostname }}
      delegate_to: "{{ control_plane_host }}"
      register: node_present
      failed_when: false
      changed_when: false

    - name: Genereaza token de join pe control-plane
      command: microk8s add-node --token-ttl 600 --format short
      delegate_to: "{{ control_plane_host }}"
      register: add_node
      changed_when: false
      when: node_present.rc != 0

    - name: Extrage string-ul de join pentru IP-ul intern al control-plane
      set_fact:
        join_string: "{{ add_node.stdout_lines | select('search', control_plane_ip) | list | first }}"
      when: node_present.rc != 0

    - name: Join worker la cluster
      command: "microk8s join {{ join_string }} --worker"
      when: node_present.rc != 0

    - name: Asteptare nod Ready (de pe control-plane)
      command: microk8s kubectl wait --for=condition=Ready node/{{ inventory_hostname }} --timeout=180s
      delegate_to: "{{ control_plane_host }}"
      changed_when: false
      when: node_present.rc != 0

# -----------------------------------------------------------------------------
# PLAY 3 — verificare
# -----------------------------------------------------------------------------
- name: Verificare cluster format
  hosts: control_plane
  become: true
  gather_facts: false
  tasks:
    - name: Lista noduri
      command: microk8s kubectl get nodes -o wide
      register: nodes_out
      changed_when: false
    - name: Afisare noduri
      debug:
        var: nodes_out.stdout_lines
